# =============================================================================
# Zubeli — Manual production migration (LOCAL file; runs ONLY when a human
# dispatches it after the user approves — never automatically, never on push)
# -----------------------------------------------------------------------------
# Why this exists: production schema changes are forward-only and are NEVER
# applied by the deploy. Vercel builds are read-only and must not mutate the
# schema; `prisma migrate deploy` must talk to Neon's DIRECT / UNPOOLED
# connection (the POOLED runtime URL cannot reliably run DDL).
#
# REQUIRED GitHub secret (NAME only — you create it yourself; this repo
# creates nothing and stores no value): `DATABASE_URL_UNPOOLED`
#   = Neon's direct/unpooled connection string, ending in `?sslmode=require`.
# The Vercel runtime keeps Neon's POOLED connection string in `DATABASE_URL`.
#
# Safety:
#   - workflow_dispatch ONLY, guarded by a typed confirmation input.
#   - No `vercel` / deploy command here — this job ONLY runs migrations.
#   - `environment: production` is the recommended approval gate (add required
#     reviewers in GitHub → Settings → Environments). Creating that environment
#     is a GitHub-side action for the user; this file assumes nothing.
#   - Take a Neon branch / note the PITR window BEFORE dispatching: migrations
#     are forward-only, there are no down-migrations (docs/RUNBOOK.md →
#     "Deployment (Vercel + Neon + Blob)" → rollback / backups).
# =============================================================================

name: Migrate production (manual)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "migrate" to run forward-only migrations against production'
        required: true
        type: string

# Never cancel a half-applied migration — queue instead.
concurrency:
  group: migrate-production
  cancel-in-progress: false

jobs:
  migrate:
    if: ${{ github.event.inputs.confirm == 'migrate' }}
    name: prisma migrate deploy (Neon unpooled)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22 (npm cache)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies (locked)
        run: npm ci
        timeout-minutes: 10

      # Reads the secret-by-NAME into DATABASE_URL for this step only. The
      # value is never echoed and never stored in this file.
      - name: Apply migrations (direct/unpooled URL)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: npx prisma migrate deploy
